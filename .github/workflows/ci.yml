# テスト（node --test）。依存はないので npm install はしない
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 構文の確認
        run: for f in js/*.js js/engine/*.js js/ui/*.js js/story/*.js; do node --check "$f"; done
      - name: テスト
        run: node --test tests/*.test.mjs
